# Azure DevOps Pipeline — Main Deploy Template
# Triggered via Main.yml entrypoint; not triggered directly.
#
# Stage sequence per GlobalAzureDevOpsPipelineStandards.md Section 2.3:
#   1. WindowCheck   — stop cleanly if outside the configured CST delivery window (automated runs only)
#   2. CheckFiles    — skip all if no code changes; separately flag DB schema changes
#   3. Build         — compile DACPAC; fail + notify on error
#   4. AnalyzeSchema — skipped if no DB schema changes; destructive + no pre-deploy script -> fail + notify
#   5. DeployAzure   — backup, deploy, validate; rollback + notify on failure
#   6. PostDeploymentTests — smoke validation
#
# KNOWN DEFERRED WORK (see Database/README.md): Post-Deploy Smoke Validation below is a stub
# that only logs a message; no live schema/query validation has been implemented yet.

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  sqlProjectName: '<sqlProjectName>'
  sqlProjectPath: '<sqlProjectRelativePath>'
  sqlServerName: '<sqlServerName>'
  databaseName: '<databaseName>'
  enableAutoCorruptionRecovery: 'true'
  preDeployScriptPath: '<preDeployScriptRelativePath>'

stages:

  # -----------------------------------------------------------------------
  # Step 1 — Deployment window check.
  #   Outside the configured CST delivery window on automated run -> stop pipeline cleanly.
  #   Manual run -> bypass.
  #   Nothing else runs until this passes.
  # -----------------------------------------------------------------------
  - stage: WindowCheck
    displayName: 'Step 1 — Deployment Window Check'
    jobs:
      - job: CheckWindow
        displayName: 'Evaluate CST Deployment Window'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: none

          - task: PowerShell@2
            displayName: 'Evaluate CST deployment window'
            name: windowCheck
            inputs:
              pwsh: true
              targetType: 'inline'
              script: |
                if ('$(Build.Reason)' -eq 'Manual')
                {
                  Write-Host 'Manual run — deployment window check bypassed.'
                  Write-Host '##vso[task.setvariable variable=skipDeployment;isOutput=true]false'
                  return
                }

                $centralNow = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'Central Standard Time')
                $hour = $centralNow.Hour
                Write-Host "Central time now: $($centralNow.ToString('yyyy-MM-dd HH:mm:ss zzz'))"

                $windowStartHour = [int]'$(deliveryWindowStartHourCst)'
                $windowEndHour = [int]'$(deliveryWindowEndHourCst)'
                Write-Host "Configured CST deployment window: start=$windowStartHour end=$windowEndHour"

                if ($windowStartHour -eq $windowEndHour)
                {
                  $inWindow = $true
                }
                elseif ($windowStartHour -lt $windowEndHour)
                {
                  $inWindow = $hour -ge $windowStartHour -and $hour -lt $windowEndHour
                }
                else
                {
                  $inWindow = $hour -ge $windowStartHour -or $hour -lt $windowEndHour
                }
                if (-not $inWindow)
                {
                  Write-Host "Outside configured CST deployment window (start=$windowStartHour end=$windowEndHour hour=$hour). Stopping pipeline. Trigger manually to deploy outside this window."
                  Write-Host '##vso[task.setvariable variable=skipDeployment;isOutput=true]true'
                  return
                }
                Write-Host 'Within configured CST deployment window. Continuing.'
                Write-Host '##vso[task.setvariable variable=skipDeployment;isOutput=true]false'

  # -----------------------------------------------------------------------
  # Step 2 — Check for code changes.
  #   Outputs:
  #     skipAll   = true  -> docs-only change, skip everything
  #     dbChanged = true  -> .sql or .sqlproj files changed, run AnalyzeSchema
  # -----------------------------------------------------------------------
  - stage: CheckFiles
    displayName: 'Step 2 — Check for Code Changes'
    dependsOn: WindowCheck
    condition: |
      and(
        succeeded('WindowCheck'),
        ne(dependencies.WindowCheck.outputs['CheckWindow.windowCheck.skipDeployment'], 'true')
      )
    jobs:
      - job: DetectChanges
        displayName: 'Detect Code and DB Changes'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true

          - task: PowerShell@2
            displayName: 'Classify changed files'
            name: detectChanges
            inputs:
              targetType: 'inline'
              script: |
                $ErrorActionPreference = 'Continue'
                $null = cmd /c "git fetch origin main 2>&1"
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=warning]git fetch returned exit code $LASTEXITCODE — diff may be incomplete."
                }
                $changedFiles = cmd /c "git diff --name-only HEAD~1...HEAD 2>&1" | Where-Object { $_ -notmatch '^(fatal|error|warning|From )' }
                Write-Host "Changed files:`n$($changedFiles -join "`n")"

                $codeFiles = $changedFiles | Where-Object {
                  $_ -match '^<sqlProjectRelativePathRoot>/' -or $_ -match '^\.azure-pipelines/'
                }
                $dbFiles = $changedFiles | Where-Object {
                  $_ -match '\.sql$' -or $_ -match '\.sqlproj$'
                }

                if ($codeFiles) {
                  Write-Host "Code changes detected — pipeline will proceed."
                  Write-Host "##vso[task.setvariable variable=skipAll;isOutput=true]false"
                } else {
                  Write-Host "No code changes detected — docs-only change. Skipping remaining stages."
                  Write-Host "##vso[task.setvariable variable=skipAll;isOutput=true]true"
                }

                if ($dbFiles) {
                  Write-Host "DB schema files changed — AnalyzeSchema will run."
                  Write-Host "##vso[task.setvariable variable=dbChanged;isOutput=true]true"
                } else {
                  Write-Host "No DB schema files changed — AnalyzeSchema will be skipped."
                  Write-Host "##vso[task.setvariable variable=dbChanged;isOutput=true]false"
                }

  # -----------------------------------------------------------------------
  # Step 3 — Build DACPAC.
  #   Failure -> post run comment notification and fail pipeline.
  # -----------------------------------------------------------------------
  - stage: Build
    displayName: 'Step 3 — Build DACPAC'
    dependsOn:
      - WindowCheck
      - CheckFiles
    condition: |
      and(
        succeeded('CheckFiles'),
        ne(dependencies.WindowCheck.outputs['CheckWindow.windowCheck.skipDeployment'], 'true'),
        ne(dependencies.CheckFiles.outputs['DetectChanges.detectChanges.skipAll'], 'true')
      )
    jobs:
      - job: BuildDacpac
        displayName: 'Build SQL Project'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: VSBuild@1
            displayName: 'Build SQL Database Project'
            inputs:
              solution: '$(sqlProjectPath)'
              platform: '$(buildPlatform)'
              configuration: '$(buildConfiguration)'

          - task: PowerShell@2
            displayName: 'SQL Source Validation'
            inputs:
              targetType: 'inline'
              script: |
                $warnings = 0
                $spDir = "$(Build.SourcesDirectory)/<sqlProjectName>/dbo/Stored Procedures"
                if (-not (Test-Path $spDir)) { Write-Host "No stored procedures directory found. Skipping source validation."; exit 0 }
                $sqlFiles = Get-ChildItem -Path $spDir -Filter "*.sql" -Recurse
                foreach ($file in $sqlFiles) {
                  $content = Get-Content $file.FullName -Raw
                  if ($content -match "EXEC\s*\(" -and $content -match "\+\s*@") {
                    Write-Host "##vso[task.logissue type=warning]Potential dynamic SQL risk in: $($file.Name)"
                    $warnings++
                  }
                  if ($content -match "CREATE\s+PROCEDURE|ALTER\s+PROCEDURE" -and $content -notmatch "SET\s+NOCOUNT\s+ON") {
                    Write-Host "##vso[task.logissue type=warning]Missing SET NOCOUNT ON in: $($file.Name)"
                    $warnings++
                  }
                }
                Write-Host "##[section]Source validation completed with $warnings warning(s)."

          - task: PowerShell@2
            displayName: 'Locate & Stage DACPAC'
            inputs:
              targetType: 'inline'
              script: |
                $projectRoot = "$(Build.SourcesDirectory)/<sqlProjectName>"
                $searchRoots = @(
                  "$projectRoot/bin/$(buildConfiguration)",
                  "$projectRoot/bin/Output",
                  "$projectRoot/bin",
                  "$projectRoot/obj"
                ) | Where-Object { Test-Path $_ }

                $dacpac = $null
                if ($searchRoots.Count -gt 0) {
                  $dacpac = Get-ChildItem -Path $searchRoots -Filter "*.dacpac" -Recurse -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -First 1
                }
                if (-not $dacpac) {
                  Write-Host "##vso[task.logissue type=error]No DACPAC found after build."
                  exit 1
                }
                $targetDir = "$(Build.ArtifactStagingDirectory)/dacpac"
                New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
                $targetFile = Join-Path $targetDir "$(sqlProjectName).dacpac"
                Copy-Item $dacpac.FullName $targetFile -Force
                Write-Host "##[section]DACPAC staged: $targetFile ($((Get-Item $targetFile).Length) bytes)"

          - task: PublishBuildArtifacts@1
            displayName: 'Publish DACPAC Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/dacpac'
              ArtifactName: 'dacpac'
              publishLocation: 'Container'

          - task: PowerShell@2
            displayName: 'Notify — Build Failure'
            condition: failed()
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: 'inline'
              script: |
                $runUrl = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                $body = @{
                  text = "**Build failed** — <repositoryDisplayName> `$(Build.SourceBranch)`` Build [$(Build.BuildNumber)]($runUrl) failed at the Build stage. No deployment was attempted."
                } | ConvertTo-Json
                $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"; "Content-Type" = "application/json" }
                $url = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/comments?api-version=7.1"
                try { Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body | Out-Null } catch { Write-Host "Notification post failed: $_" }

  # -----------------------------------------------------------------------
  # Step 4 — Analyze schema changes (DB files only).
  #   Skipped entirely if no .sql/.sqlproj files changed.
  #   Destructive changes without a pre-deploy script -> fail + notify.
  # -----------------------------------------------------------------------
  - stage: AnalyzeSchema
    displayName: 'Step 4 — Analyze Schema Changes'
    dependsOn:
      - WindowCheck
      - CheckFiles
      - Build
    condition: |
      and(
        succeeded('Build'),
        ne(dependencies.WindowCheck.outputs['CheckWindow.windowCheck.skipDeployment'], 'true'),
        ne(dependencies.CheckFiles.outputs['DetectChanges.detectChanges.skipAll'], 'true'),
        eq(dependencies.CheckFiles.outputs['DetectChanges.detectChanges.dbChanged'], 'true')
      )
    jobs:
      - job: Analyze
        displayName: 'Generate Diff and Evaluate Changes'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: DownloadBuildArtifacts@0
            displayName: 'Download DACPAC Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'dacpac'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: PowerShell@2
            displayName: 'Validate DACPAC present'
            inputs:
              targetType: 'inline'
              script: |
                $dacpacFile = "$(System.ArtifactsDirectory)/dacpac/$(sqlProjectName).dacpac"
                if (-not (Test-Path $dacpacFile)) {
                  Write-Host "##vso[task.logissue type=error]DACPAC not found: $dacpacFile"
                  exit 1
                }
                Write-Host "##[section]DACPAC confirmed: $dacpacFile ($((Get-Item $dacpacFile).Length) bytes)"

          - task: PowerShell@2
            displayName: 'Create diff script output directory'
            inputs:
              targetType: 'inline'
              script: |
                New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)/diff-script" -Force | Out-Null

          - task: SqlAzureDacpacDeployment@1
            displayName: 'Generate Schema Diff Script'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              AuthenticationType: 'servicePrincipal'
              ServerName: '$(sqlServerName).database.windows.net'
              DatabaseName: '$(databaseName)'
              deployType: 'DacpacTask'
              DeploymentAction: 'Script'
              DacpacFile: '$(System.ArtifactsDirectory)/dacpac/$(sqlProjectName).dacpac'
              ScriptPath: '$(Build.ArtifactStagingDirectory)/diff-script/deploy-diff.sql'
              GenerateFirewallRule: false
              AdditionalArguments: '/p:BlockOnPossibleDataLoss=True /p:DropObjectsNotInSource=False /p:GenerateSmartDefaults=True'
              IpDetectionMethod: 'AutoDetect'

          - task: PowerShell@2
            displayName: 'Evaluate diff for destructive changes'
            inputs:
              targetType: 'inline'
              script: |
                $diffScript = "$(Build.ArtifactStagingDirectory)/diff-script/deploy-diff.sql"
                if (-not (Test-Path $diffScript)) {
                  Write-Host "##vso[task.logissue type=error]Diff script not found at: $diffScript"
                  exit 1
                }

                $sql = Get-Content $diffScript -Raw
                Write-Host "##[section]Diff script size: $((Get-Item $diffScript).Length) bytes"

                $destructivePatterns = @(
                  'DROP\s+TABLE',
                  'DROP\s+COLUMN',
                  'DROP\s+INDEX',
                  'ALTER\s+COLUMN.*NOT\s+NULL',
                  'sp_rename'
                )
                $destructiveFound = @()
                foreach ($pattern in $destructivePatterns) {
                  if ($sql -match $pattern) { $destructiveFound += $pattern }
                }

                if ($destructiveFound.Count -gt 0) {
                  Write-Host "##[section]Destructive operations detected: $($destructiveFound -join ', ')"
                  $preDeployDir = "$(Build.SourcesDirectory)/$(preDeployScriptPath)"
                  $preDeployScripts = Get-ChildItem -Path $preDeployDir -Filter "*.sql" -Recurse -ErrorAction SilentlyContinue
                  if ($preDeployScripts.Count -gt 0) {
                    Write-Host "Pre-deploy script present ($($preDeployScripts.Count) file(s)) — proceeding to deploy."
                  } else {
                    Write-Host "##vso[task.logissue type=error]Destructive schema changes detected but no pre-deploy script found in $(preDeployScriptPath)."
                    Write-Host "##vso[task.logissue type=error]Add a pre-deploy script to account for the destructive operation before merging."
                    exit 1
                  }
                } else {
                  Write-Host "No destructive schema changes detected — proceeding to deploy."
                }

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Diff Script Artifact'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/diff-script'
              ArtifactName: 'diff-script'
              publishLocation: 'Container'

          - task: PowerShell@2
            displayName: 'Notify — Destructive Change Blocked'
            condition: failed()
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: 'inline'
              script: |
                $runUrl = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                $body = @{
                  text = "**Deployment blocked** — <repositoryDisplayName> ``$(Build.SourceBranch)`` Build [$(Build.BuildNumber)]($runUrl) detected destructive schema changes with no pre-deploy script present. Deployment was not attempted. Add a pre-deploy script to ``$(preDeployScriptPath)`` to resolve."
                } | ConvertTo-Json
                $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"; "Content-Type" = "application/json" }
                $url = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/comments?api-version=7.1"
                try { Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body | Out-Null } catch { Write-Host "Notification post failed: $_" }

  # -----------------------------------------------------------------------
  # Step 5 — Deploy to Azure SQL.
  #   AnalyzeSchema may be Skipped (no DB files changed) — that is intentional.
  #   Failure -> rollback from pre-deploy backup + notify.
  # -----------------------------------------------------------------------
  - stage: DeployAzure
    displayName: 'Step 5 — Deploy to Azure SQL'
    dependsOn:
      - WindowCheck
      - CheckFiles
      - Build
      - AnalyzeSchema
    condition: |
      and(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(dependencies.WindowCheck.outputs['CheckWindow.windowCheck.skipDeployment'], 'true'),
        ne(dependencies.CheckFiles.outputs['DetectChanges.detectChanges.skipAll'], 'true'),
        in(dependencies.Build.result, 'Succeeded'),
        in(dependencies.AnalyzeSchema.result, 'Succeeded', 'Skipped')
      )
    jobs:
      - job: DeployToAzure
        displayName: 'Deploy DACPAC to Azure SQL'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: DownloadBuildArtifacts@0
            displayName: 'Download DACPAC Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'dacpac'
              downloadPath: '$(System.ArtifactsDirectory)'

          - task: PowerShell@2
            displayName: 'Validate Deployment Inputs'
            inputs:
              targetType: 'inline'
              script: |
                $dacpacFile = "$(System.ArtifactsDirectory)/dacpac/$(sqlProjectName).dacpac"
                if (-not (Test-Path $dacpacFile)) {
                  Write-Host "##vso[task.logissue type=error]DACPAC file not found: $dacpacFile"
                  exit 1
                }
                Write-Host "##[section]Target: $(sqlServerName).database.windows.net / $(databaseName)"
                $summaryFile = "$(Build.ArtifactStagingDirectory)/deploy-summary.md"
                @"
                # Deployment Summary
                - Branch: ``$(Build.SourceBranch)``
                - Build:  ``$(Build.BuildNumber)``
                - Server: ``$(sqlServerName).database.windows.net``
                - Database: ``$(databaseName)``
                "@ | Out-File -FilePath $summaryFile -Encoding utf8
                Write-Host "##vso[task.uploadsummary]$summaryFile"

          - task: AzureCLI@2
            displayName: 'Create Pre-Deploy Backup'
            condition: eq(variables['enableAutoCorruptionRecovery'], 'true')
            inputs:
              azureSubscription: '<azureServiceConnectionName>'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
                $backupDbName = "$(databaseName)_predeploy_$(Build.BuildId)_$timestamp"
                $resourceGroup = az resource list --resource-type "Microsoft.Sql/servers" --name "$(sqlServerName)" --query "[0].resourceGroup" -o tsv
                if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
                  Write-Host "##vso[task.logissue type=error]Could not resolve SQL Server resource group."
                  exit 1
                }
                az sql db copy --resource-group $resourceGroup --server "$(sqlServerName)" --name "$(databaseName)" --dest-name $backupDbName --dest-server "$(sqlServerName)" --output none
                Write-Host "##vso[task.setvariable variable=SqlResourceGroup]$resourceGroup"
                Write-Host "##vso[task.setvariable variable=PreDeployBackupDatabaseName]$backupDbName"
                Write-Host "##[section]Pre-deploy backup created: $backupDbName"

          - task: SqlAzureDacpacDeployment@1
            displayName: 'Deploy DACPAC to Azure SQL'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              AuthenticationType: 'servicePrincipal'
              ServerName: '$(sqlServerName).database.windows.net'
              DatabaseName: '$(databaseName)'
              deployType: 'DacpacTask'
              DeploymentAction: 'Publish'
              DacpacFile: '$(System.ArtifactsDirectory)/dacpac/$(sqlProjectName).dacpac'
              AdditionalArguments: '/p:BlockOnPossibleDataLoss=True /p:DropObjectsNotInSource=False /p:GenerateSmartDefaults=True'
              IpDetectionMethod: 'AutoDetect'

          - task: PowerShell@2
            displayName: 'Post-Deploy Smoke Validation'
            condition: succeeded()
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "##[section]Post-deploy validation — extend with live schema queries as needed."

          - task: AzureCLI@2
            displayName: 'Rollback — Restore Pre-Deploy Backup'
            condition: and(failed(), eq(variables['enableAutoCorruptionRecovery'], 'true'), ne(variables['PreDeployBackupDatabaseName'], ''))
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $backupDb = "$(PreDeployBackupDatabaseName)"
                $resourceGroup = "$(SqlResourceGroup)"
                if ([string]::IsNullOrWhiteSpace($backupDb) -or [string]::IsNullOrWhiteSpace($resourceGroup)) {
                  Write-Host "##vso[task.logissue type=error]Rollback metadata missing — manual intervention required."
                  exit 1
                }
                $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
                $corruptDbName = "$(databaseName)_corrupt_$timestamp"
                az sql db rename --resource-group $resourceGroup --server "$(sqlServerName)" --name "$(databaseName)" --new-name $corruptDbName --output none
                az sql db copy --resource-group $resourceGroup --server "$(sqlServerName)" --name $backupDb --dest-name "$(databaseName)" --dest-server "$(sqlServerName)" --output none
                $summaryFile = "$(Build.ArtifactStagingDirectory)/rollback-summary.md"
                @"
                # Rollback Executed
                - Corrupted database renamed to: ``$corruptDbName``
                - Production restored from: ``$backupDb``
                - Server: ``$(sqlServerName).database.windows.net``
                - Build: ``$(Build.BuildNumber)``
                "@ | Out-File -FilePath $summaryFile -Encoding utf8
                Write-Host "##vso[task.uploadsummary]$summaryFile"

          - task: PowerShell@2
            displayName: 'Notify — Deploy Failure and Rollback'
            condition: failed()
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: 'inline'
              script: |
                $runUrl = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                $body = @{
                  text = "**Deploy failed** — <repositoryDisplayName> ``$(Build.SourceBranch)`` Build [$(Build.BuildNumber)]($runUrl) failed during deployment to ``$(databaseName)``. Rollback from pre-deploy backup was attempted. Manual validation of database state is required."
                } | ConvertTo-Json
                $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"; "Content-Type" = "application/json" }
                $url = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/build/builds/$(Build.BuildId)/comments?api-version=7.1"
                try { Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body | Out-Null } catch { Write-Host "Notification post failed: $_" }
