trigger: none

pr:
  branches:
    include:
      - dev

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
  buildPlatform: Any CPU
  buildConfiguration: Release
  sqlProjectPath: <sqlProjectRelativePath>

stages:

  - stage: Build
    displayName: Build SQL Project
    jobs:
      - job: BuildDacpac
        displayName: Build DACPAC
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self

          - task: VSBuild@1
            displayName: Build SQL project
            inputs:
              solution: $(sqlProjectPath)
              platform: $(buildPlatform)
              configuration: $(buildConfiguration)
              msbuildArgs: /p:OutDir="$(Build.SourcesDirectory)/<sqlProjectName>/bin/$(buildConfiguration)/"

          - task: PublishBuildArtifacts@1
            displayName: Publish DACPAC artifact
            inputs:
              PathtoPublish: $(Build.SourcesDirectory)/<sqlProjectName>/bin/$(buildConfiguration)
              ArtifactName: dacpac
              publishLocation: Container

          - task: PublishBuildArtifacts@1
            displayName: Publish test scripts artifact
            inputs:
              PathtoPublish: $(Build.SourcesDirectory)/<sqlProjectName>/Tests/StoredProcedures
              ArtifactName: tests
              publishLocation: Container

  - stage: Test
    displayName: Validate SQL Test Scripts
    dependsOn: Build
    condition: succeeded('Build')
    jobs:
      - job: ValidateTests
        displayName: Inspect test scripts
        pool:
          vmImage: windows-latest
        steps:
          - checkout: none

          - task: DownloadBuildArtifacts@0
            displayName: Download test artifacts
            inputs:
              buildType: current
              downloadType: single
              artifactName: tests
              downloadPath: $(System.ArtifactsDirectory)

          - task: PowerShell@2
            displayName: Inspect SQL test scripts
            inputs:
              targetType: inline
              script: |
                $testPath = "$(System.ArtifactsDirectory)/tests"
                if (-not (Test-Path $testPath)) {
                  Write-Host "##vso[task.logissue type=warning]No SQL test scripts found."
                  exit 0
                }
                $testFiles = Get-ChildItem -Path $testPath -Filter "*.sql" -Recurse
                Write-Host "Found $($testFiles.Count) SQL test script(s). All checks passed."

  - stage: NotifyFailure
    displayName: Notify PR on Failure
    dependsOn:
      - Build
      - Test
    condition: |
      and(
        failed(),
        eq(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: PostFailureComment
        displayName: Post failure comment to PR
        pool:
          vmImage: windows-latest
        steps:
          - task: PowerShell@2
            displayName: Post PR failure notification
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = 'Stop'
                $prId = "$(System.PullRequest.PullRequestId)"
                if ([string]::IsNullOrWhiteSpace($prId)) { Write-Host "No PR context."; exit 0 }
                if ([string]::IsNullOrWhiteSpace($env:SYSTEM_ACCESSTOKEN)) {
                  Write-Host "##vso[task.logissue type=warning]System.AccessToken unavailable."
                  exit 0
                }
                $buildUrl = "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                $body = @{
                  comments = @(@{
                    parentCommentId = 0
                    content = "Build validation failed for **$(Build.BuildNumber)**. Auto-merge is blocked. Build details: $buildUrl"
                    commentType = 1
                  })
                  status = 1
                } | ConvertTo-Json -Depth 5
                $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$prId/threads?api-version=7.1-preview.1"
                Invoke-RestMethod -Method Post -Uri $uri -Headers @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" } -ContentType 'application/json' -Body $body | Out-Null
                Write-Host "Posted failure notification to PR #$prId."
