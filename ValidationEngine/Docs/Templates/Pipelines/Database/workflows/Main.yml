# Azure DevOps Pipeline — Main Entrypoint
# Triggers CI on main push; PR gate on main protects against direct merges.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - <sqlProjectRelativePathRoot>/**
      - .azure-pipelines/**
    exclude:
      - "**/*.md"

pr:
  branches:
    include:
      - main

extends:
  template: MainDeploy.yml
