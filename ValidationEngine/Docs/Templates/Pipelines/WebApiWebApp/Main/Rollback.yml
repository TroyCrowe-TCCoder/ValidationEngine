stages:
- stage: Rollback
  displayName: Rollback
  dependsOn: Validate
  variables:
    FailureCategory: $[ dependencies.Validate.outputs['ValidateLiveSite.checkhealth.FailureCategory'] ]
  # Trigger on any Validate failure, not just an explicit IsValid=false. If Validate fails
  # for a reason other than the health-check script (e.g. agent crash, task timeout) before
  # IsValid is ever set, that variable stays undefined - requiring it to equal 'false' would
  # skip Rollback and leave production swapped to a possibly-bad version with staging never
  # cleared. Swap only reaches Validate after a real promotion occurred, so any Validate
  # failure means production is live on the new version and must be rolled back.
  condition: failed('Validate')
  jobs:
  - deployment: RollbackLiveSwap
    displayName: Roll back slot swap
    environment: <mainEnvironmentName>
    pool:
      vmImage: windows-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            displayName: Swap production back to previous version
            name: rollbackswap
            # retryCountOnTaskFailure is evaluated at YAML compile time and cannot expand a
            # runtime $(variable) macro - it must be a literal integer. Keep this in sync with
            # slotSwapTaskRetryCount in Variables/Variables.yml.
            retryCountOnTaskFailure: <slotSwapTaskRetryCount>
            inputs:
              azureSubscription: $(azureServiceConnection)
              Action: Swap Slots
              WebAppName: $(appServiceName)
              ResourceGroupName: $(resourceGroupName)
              SourceSlot: $(deploymentSlotName)
              SwapWithProduction: true

          # Only clear staging when the Validate failure was classified as an application issue
          # (a genuinely bad build). For infrastructure-classified failures (platform/network
          # blips, timeouts, gateway errors) the build is kept in staging so it can be
          # investigated or retried, rather than discarded on what may not have been a real
          # code defect.
          - task: AzureCLI@2
            displayName: Clear staging slot content after successful rollback
            condition: and(succeeded(), eq(variables['FailureCategory'], 'AppIssue'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                # After swapping back, staging holds the failed candidate. Staging must always end
                # empty after a full promotion cycle - whether it succeeds or is rolled back - so
                # that "staging has an artifact" remains a reliable signal for the next Dev deploy.
                #
                # Uses the pipeline's UMI (via the already-authenticated az CLI session) to get an
                # Azure AD bearer token for Kudu, rather than SCM basic-auth publishing credentials -
                # basic auth is disabled on this App Service, so a Bearer token is required instead.
                $accessToken = az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv
                $kuduHost = "$(appServiceName)-$(deploymentSlotName).scm.azurewebsites.net"
                $headers = @{ Authorization = "Bearer $accessToken" }

                $body = @{
                  command = 'cmd /c del /q /s *.* 2^>nul & for /d %i in (*) do rmdir /s /q "%i"'
                  dir     = 'site\wwwroot'
                } | ConvertTo-Json

                Invoke-RestMethod -Uri "https://$kuduHost/api/command" -Headers $headers -Method Post -ContentType 'application/json' -Body $body | Out-Null
                Write-Host 'Staging slot content cleared after rollback.'

          # Fires only when the rollback swap itself failed after exhausting its retries.
          # Production may still be running the bad/unhealthy build with no automatic recovery,
          # so this must notify immediately and stop unattended (scheduled) runs from repeating
          # the same failure until a human has addressed it.
          - task: PowerShell@2
            displayName: Notify on complete rollback failure
            # failed('stepName') is invalid within the same job; the no-argument form checks
            # whether any previous step in this job (i.e. the 'rollbackswap' step) failed.
            condition: failed()
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $webhookUrl = '$(notificationWebhookUrl)'
                if ([string]::IsNullOrWhiteSpace($webhookUrl)) {
                  Write-Host '##vso[task.logissue type=warning]notificationWebhookUrl is not configured - skipping failure notification. Configure this variable to enable alerts.'
                }
                else {
                  $message = "ROLLBACK FAILED after $(slotSwapTaskRetryCount) retries for build $(Build.BuildNumber) (run $(Build.BuildId)). Production may be running an unhealthy build. The scheduled trigger for this pipeline will be DISABLED and will require manual re-enabling in pipeline settings before it will run again. Immediate attention required: https://dev.azure.com/$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
                  $body = @{ text = $message } | ConvertTo-Json
                  Invoke-RestMethod -Uri $webhookUrl -Method Post -ContentType 'application/json' -Body $body | Out-Null
                  Write-Host 'Rollback failure notification sent.'
                }

          # Disable the scheduled trigger so the scheduled run does not repeat an
          # unaddressed rollback failure. Requires the pipeline's build service identity to
          # have edit permission on this pipeline definition.
          - task: PowerShell@2
            displayName: Disable scheduled trigger after rollback failure
            # failed('stepName') is invalid within the same job; the no-argument form checks
            # whether any previous step in this job (i.e. the 'rollbackswap' step) failed.
            condition: failed()
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $orgUri = "$(System.CollectionUri)"
                $project = "$(System.TeamProject)"
                $definitionId = "$(System.DefinitionId)"
                $headers = @{ Authorization = "Bearer $(System.AccessToken)" }
                $apiVersion = '7.1'

                $definitionUrl = "$orgUri$project/_apis/build/definitions/$($definitionId)?api-version=$apiVersion"
                try {
                  $definition = Invoke-RestMethod -Uri $definitionUrl -Headers $headers -Method Get
                  $definition.triggers = @($definition.triggers | Where-Object { $_.triggerType -ne 'schedule' })
                  $body = $definition | ConvertTo-Json -Depth 50
                  Invoke-RestMethod -Uri $definitionUrl -Headers $headers -Method Put -ContentType 'application/json' -Body $body | Out-Null
                  Write-Host '##vso[task.logissue type=warning]Scheduled trigger disabled after unaddressed rollback failure. Re-enable manually in pipeline settings once the issue is resolved.'
                }
                catch {
                  Write-Host "##vso[task.logissue type=error]Failed to disable scheduled trigger: $($_.Exception.Message). Manually disable the schedule until the rollback failure is addressed."
                }

          - task: PowerShell@2
            displayName: Fail release after rollback
            inputs:
              pwsh: true
              targetType: inline
              script: |
                throw 'Live-site validation failed after swap. Rollback completed and the release remains blocked.'
