parameters:
- name: stageName
  type: string
  default: StandardsValidation
- name: dependsOn
  type: object
  default:
  - ChangeDetection
- name: condition
  type: string
  default: >-
    and(
      not(failed()),
      not(canceled()),
      eq(dependencies.ChangeDetection.outputs['Detect.setvar.CodeChanges'], 'true')
    )

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.stageName }}
  dependsOn: ${{ parameters.dependsOn }}
  condition: ${{ parameters.condition }}
  jobs:
  - job: ValidateStandards
    displayName: Validate GlobalStandards compliance
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - checkout: GlobalStandards
      fetchDepth: 0

    - task: PowerShell@2
      name: RunValidation
      displayName: Run full standards validation
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $repoRoot = '$(Build.SourcesDirectory)/$(Build.Repository.Name)'
          $globalStandardsRoot = '$(Build.SourcesDirectory)/GlobalStandards'
          & "$globalStandardsRoot/Scripts/RunValidationEngine.ps1" -RepositoryRoot $repoRoot -GlobalStandardsRoot $globalStandardsRoot -Mode System -TargetBranch origin/dev
          Write-Host "##vso[task.setvariable variable=ValidationExitCode;isOutput=true]$LASTEXITCODE"

    - task: PowerShell@2
      displayName: Post manual-review warnings to PR
      condition: >-
        and(
          succeededOrFailed(),
          eq(variables['Build.Reason'], 'PullRequest')
        )
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $discrepancyFile = '$(Build.SourcesDirectory)/$(Build.Repository.Name)/Working/ValidationDiscrepancies.md'
          if (-not (Test-Path $discrepancyFile)) {
            Write-Host 'No ValidationDiscrepancies.md found; nothing to post.'
            exit 0
          }

          $content = Get-Content $discrepancyFile -Raw
          if ($content -notmatch 'Manual Review Required') {
            Write-Host 'No manual-review warnings section present; nothing to post.'
            exit 0
          }

          $manualSection = [regex]::Match($content, '(?s)## Manual Review Required.*').Value
          $commentBody = "### Standards Validation - Manual Review Required`n`nThe automated checks passed, but the following items require reviewer judgment before approving this PR:`n`n$manualSection"

          $org = "$(System.CollectionUri)".TrimEnd('/')
          $project = "$(System.TeamProject)"
          $repoId = "$(Build.Repository.ID)"
          $prId = "$(System.PullRequest.PullRequestId)"
          $uri = "$org/$project/_apis/git/repositories/$repoId/pullRequests/$prId/threads?api-version=7.1"

          $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
          $body = @{
            comments = @(@{ parentCommentId = 0; content = $commentBody; commentType = 1 })
            status   = 1
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          Write-Host 'Posted manual-review warnings to PR thread.'

    - task: PowerShell@2
      displayName: Enforce validation result
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $code = '$(RunValidation.ValidationExitCode)'
          if ($code -ne '0') {
            Write-Error 'Standards validation failed. See RunValidation step log for blocking violations.'
            exit 1
          }
          Write-Host 'Standards validation passed (blocking checks).'
