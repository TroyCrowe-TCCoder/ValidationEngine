parameters:
- name: mode
  type: string
  default: pr
- name: targetBranch
  type: string
  default: ''

stages:
- stage: ChangeDetection
  displayName: ChangeDetection
  jobs:
  - job: Detect
    displayName: Detect code changes
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0

    - task: PowerShell@2
      displayName: Evaluate changed files
      name: setvar
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $mode = '${{ parameters.mode }}'
          $targetBranch = '${{ parameters.targetBranch }}'
          $codeChanges = $true

          if ($mode -eq 'main') {
            $previousCommit = '$(Build.SourceVersion)^'
            git rev-parse $previousCommit 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host 'No previous commit available. Treating as code changes.'
              Write-Host '##vso[task.setvariable variable=CodeChanges;isOutput=true]true'
              exit 0
            }

            $changedFiles = git diff --name-only $previousCommit '$(Build.SourceVersion)'
          }
          else {
            if ([string]::IsNullOrWhiteSpace($targetBranch)) {
              $targetBranch = '$(System.PullRequest.TargetBranch)'
            }

            if ([string]::IsNullOrWhiteSpace($targetBranch) -or $targetBranch -like '*$(*)*') {
              Write-Host 'No PR target branch detected. Treating as code changes.'
              Write-Host '##vso[task.setvariable variable=CodeChanges;isOutput=true]true'
              exit 0
            }

            $targetBranch = $targetBranch -replace '^refs/heads/', ''
            git fetch origin $targetBranch --depth=1 2>&1 | Out-Null
            $changedFiles = git diff --name-only "origin/$targetBranch" HEAD
          }

          Write-Host 'Changed files:'
          $changedFiles | ForEach-Object { Write-Host "  $_" }

          $codeChangedFiles = $changedFiles | Where-Object {
            $_ -and (
              $_ -match '\.(cs|csx|csproj|sln|slnx|proj)$' -or
              $_ -match '(^|/)(Directory\.Build\.props|Directory\.Build\.targets|Directory\.Packages\.props|global\.json)$' -or
              $_ -match '\.(props|targets|resx|config|json|xml)$'
            )
          }

          if (-not $codeChangedFiles) {
            $codeChanges = $false
            Write-Host 'Documentation-only changes detected. Skipping downstream code actions.'
          }
          else {
            Write-Host 'Code changes detected. Build and test will run.'
          }

          Write-Host "##vso[task.setvariable variable=CodeChanges;isOutput=true]$($codeChanges.ToString().ToLowerInvariant())"
