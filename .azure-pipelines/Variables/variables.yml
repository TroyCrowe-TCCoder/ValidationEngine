variables:
  buildConfiguration: 'Release'
  solutionPath: 'ValidationEngine.slnx'
  testSolutionPath: 'ValidationEngine.slnx'
  buildPackageArtifactName: 'nuget-drop-build'
  packageOutputPath: '$(Build.ArtifactStagingDirectory)/nuget'
  devNextBranch: 'main'

  # Azure Artifacts feed. Feed must be created in the Azure DevOps organization before this
  # pipeline runs; NuGetAuthenticate@1 resolves credentials automatically for feeds in the same org.
  artifactsFeedName: 'ValidationEngine'
  artifactsFeedUrl: 'https://pkgs.dev.azure.com/tcrowe0170/_packaging/ValidationEngine/nuget/v3/index.json'

  devValidationPipelinePath: '.azure-pipelines/Dev/dev.yml'
  mainReleasePipelinePath: '.azure-pipelines/Main/main.yml'

  # Packaging-ready class library projects (OutputType: Library with NuGet package metadata).
  # ValidationEngine, ValidationEngine.Agent, and ValidationEngine.Link are console executables
  # and are intentionally excluded from packaging.
  packableProject1: 'ValidationEngine.Models/ValidationEngine.Models.csproj'
  packableProject2: 'ValidationEngine.Reporting/ValidationEngine.Reporting.csproj'
  packableProject3: 'ValidationEngine.Analyzers/ValidationEngine.Analyzers.csproj'

  # Public NuGet.org publish gate. Enabled for Models, Reporting, and Analyzers — all three
  # PackageIds must be confirmed available (no collision with an existing nuget.org package)
  # as a manual pre-publish step before the first run; see publish-nuget-org.yml for the
  # required NuGetOrgApiKey variable group setup.
  publishToNuGetOrg: 'true'
