stages:
- stage: Publish
  displayName: Publish
  dependsOn: ChangeDetection
  variables:
    CodeChanges: $[ stageDependencies.ChangeDetection.Detect.outputs['setvar.CodeChanges'] ]
  condition: eq(variables['CodeChanges'], 'true')
  jobs:
  - job: PublishPackages
    displayName: Publish NuGet packages to Azure Artifacts
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: Use .NET SDK
      inputs:
        packageType: sdk
        version: 10.0.x
        includePreviewVersions: true

    - task: DotNetCoreCLI@2
      displayName: Restore solution
      inputs:
        command: restore
        projects: $(solutionPath)

    - task: DotNetCoreCLI@2
      displayName: Pack ValidationEngine.Models
      inputs:
        command: pack
        packagesToPack: $(packableProject1)
        configuration: $(buildConfiguration)
        outputDir: $(packageOutputPath)

    - task: DotNetCoreCLI@2
      displayName: Pack ValidationEngine.Reporting
      inputs:
        command: pack
        packagesToPack: $(packableProject2)
        configuration: $(buildConfiguration)
        outputDir: $(packageOutputPath)

    - task: DotNetCoreCLI@2
      displayName: Pack ValidationEngine.Analyzers
      inputs:
        command: pack
        packagesToPack: $(packableProject3)
        configuration: $(buildConfiguration)
        outputDir: $(packageOutputPath)

    - task: NuGetAuthenticate@1
      displayName: Authenticate to Azure Artifacts

    - task: DotNetCoreCLI@2
      displayName: Publish packages to Azure Artifacts
      inputs:
        command: custom
        custom: nuget
        arguments: push "$(packageOutputPath)/*.nupkg" --source "$(artifactsFeedUrl)" --api-key AzureDevOps --skip-duplicate
